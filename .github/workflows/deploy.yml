name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Show environment
        run: |
          echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"
          echo "GITHUB_SHA=$GITHUB_SHA"
          node --version || true
          npm --version || true
          git --version

      - name: Clone repository
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} repo
          cd repo
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build production site
        run: |
          cd repo
          npm install
          npm run build

      - name: Deploy to gh-pages
        run: |
          cd repo
          git checkout --orphan gh-pages
          git rm -rf .
          cp -R dist/. .
          git add .
          git commit -m "Deploy site from ${GITHUB_SHA}"
          git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} gh-pages
